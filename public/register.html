<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Swappr</title>
  <link rel="icon" type="image/png" href="logo.png?v=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <main class="flex-grow-1 d-flex align-items-center justify-content-center py-5">
    <div class="container" style="max-width: 440px;">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <a href="/" class="text-decoration-none text-muted small">
          <i class="fa-solid fa-arrow-left me-1"></i> Back to Home
        </a>
        <a href="/login.html" class="text-decoration-none text-primary small fw-semibold">
          Already registered?
        </a>
      </div>

      <div class="text-center mb-4">
        <a href="/" class="navbar-brand fs-3 text-dark d-inline-flex align-items-center gap-2">
          <i class="fa-solid fa-repeat text-info fs-3"></i>
          <span class="fw-bold">Swa<span class="text-info">ppr</span></span>
        </a>
        <p class="text-muted small mt-1">Create your account & get <strong class="text-warning">10 Free Credits</strong> instantly</p>
      </div>

      <div class="card p-4 shadow-sm border-0">
        <div id="alertBox"></div>
        <form id="registerForm">
          <div class="mb-3">
            <label class="form-label fw-semibold small"><i class="fa-regular fa-user me-1"></i> Full Name</label>
            <input type="text" id="name" class="form-control" placeholder="e.g. Alex Johnson" required autocomplete="name">
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold small"><i class="fa-regular fa-envelope me-1"></i> Email Address</label>
            <input type="email" id="email" class="form-control" placeholder="name@example.com" required autocomplete="email">
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold small"><i class="fa-solid fa-lock me-1"></i> Password</label>
            <input type="password" id="password" class="form-control" placeholder="Minimum 6 characters" required minlength="6" autocomplete="new-password">
          </div>
          <button type="submit" id="btnRegister" class="btn btn-primary w-100 mt-2 py-2 fw-bold shadow-sm">
            <i class="fa-solid fa-user-plus me-1"></i> Create Free Account
          </button>
        </form>

        <div class="text-center mt-3 pt-3 border-top">
          <small class="text-muted">Already have an account? <a href="/login.html" class="text-primary text-decoration-none fw-bold">Log In</a></small>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer Section -->
  <footer class="w-100 bg-dark text-light py-4 border-top border-secondary border-opacity-25">
    <div class="container">
      <div class="row align-items-center g-3">
        <div class="col-md-6 text-center text-md-start">
          <a class="navbar-brand text-warning fw-bold fs-5 d-inline-block mb-1" href="/">
            <i class="fa-solid fa-repeat text-info me-2"></i>Swa<span class="text-white">ppr</span>
          </a>
          <p class="text-secondary small mb-0">
            &copy; 2026 Swappr Skill Exchange Platform. All rights reserved.
          </p>
        </div>
        <div class="col-md-6 text-center text-md-end">
          <ul class="list-inline mb-0 small">
            <li class="list-inline-item me-3">
              <a href="/index.html" class="text-secondary text-decoration-none hover-white">
                <i class="fa-solid fa-house me-1"></i> Home
              </a>
            </li>
            <li class="list-inline-item me-3">
              <a href="/skills.html" class="text-secondary text-decoration-none hover-white">
                <i class="fa-solid fa-compass me-1"></i> Browse Skills
              </a>
            </li>
            <li class="list-inline-item">
              <span class="badge bg-success bg-opacity-25 text-success border border-success border-opacity-25">
                <i class="fa-solid fa-circle me-1" style="font-size: 8px;"></i> System Online
              </span>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/main.js"></script>
  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const alertBox = document.getElementById('alertBox');
      const btn = document.getElementById('btnRegister');
      const originalText = btn.innerHTML;

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Creating Account...';

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password })
        });
        const data = await res.json();

        if (res.ok) {
          alertBox.innerHTML = `<div class="alert alert-success py-2 small"><i class="fa-solid fa-circle-check me-1"></i> Welcome ${name}! Starting your session...</div>`;
          if (data.token && data.user) {
            localStorage.setItem('token', data.token);
            localStorage.setItem('user', JSON.stringify(data.user));
            setTimeout(() => window.location.href = '/dashboard.html', 800);
          } else {
            setTimeout(() => window.location.href = '/login.html', 1200);
          }
        } else {
          alertBox.innerHTML = `<div class="alert alert-danger py-2 small"><i class="fa-solid fa-circle-exclamation me-1"></i> ${data.message || 'Registration failed'}</div>`;
        }
      } catch (err) {
        alertBox.innerHTML = `<div class="alert alert-danger py-2 small"><i class="fa-solid fa-triangle-exclamation me-1"></i> Server connection failed. Please try again.</div>`;
      } finally {
        btn.disabled = false;
        btn.innerHTML = originalText;
      }
    });
  </script>
</body>
</html>
