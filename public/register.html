 <!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register -Swappr</title>
    <link rel="icon" type="image/png" href="logo.png?v=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Poppins:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <main class="flex-grow-1 d-flex align-items-center justify-content-center py-5">
  <div class="container" style="max-width: 450px;">
    <div class="text-center mb-4">
      <a href="/" class="navbar-brand fs-3 text-dark">
        <i class="fa-solid fa-repeat text-primary me-2"></i>Swa<span class="text-info">ppr</span>
      </a>
      <p class="text-muted">Create a free account & get 10 free credits</p>
    </div>

    <div class="card p-4">
      <div id="alertBox"></div>
      <form id="registerForm">
        <div class="mb-3">
          <label class="form-label"><i class="fa-regular fa-user me-1"></i> Full Name</label>
          <input type="text" id="name" class="form-control" placeholder="John Doe" required>
        </div>
        <div class="mb-3">
          <label class="form-label"><i class="fa-regular fa-envelope me-1"></i> Email address</label>
          <input type="email" id="email" class="form-control" placeholder="name@example.com" required>
        </div>
        <div class="mb-3">
          <label class="form-label"><i class="fa-solid fa-lock me-1"></i> Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 mt-2"><i class="fa-solid fa-user-plus me-1"></i> Register</button>
      </form>
      <div class="text-center mt-3">
        <small class="text-muted">Already registered? <a href="/login.html" class="text-primary text-decoration-none fw-bold">Login</a></small>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const alertBox = document.getElementById('alertBox');

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password })
        });
        const data = await res.json();
        
        if (res.ok) {
          alertBox.innerHTML = `<div class="alert alert-success py-2">Registered successfully! Redirecting...</div>`;
          setTimeout(() => window.location.href = '/login.html', 1500);
        } else {
          alertBox.innerHTML = `<div class="alert alert-danger py-2">${data.message}</div>`;
        }
      } catch (err) {
        alertBox.innerHTML = `<div class="alert alert-danger py-2">Server connection failed!</div>`;
      }
    });
  </script>
  </main>
<!-- Footer Section -->
<footer class="w-100 bg-dark text-light py-4 border-top border-secondary border-opacity-25">
  <div class="container">
    <div class="row align-items-center g-3">
      
      <!-- Brand & Copyright -->
      <div class="col-md-6 text-center text-md-start">
        <a class="navbar-brand text-warning fw-bold fs-5 d-inline-block mb-1" href="/">
          <i class="fa-solid fa-repeat text-info me-2"></i>Swa<span class="text-white">ppr</span>
        </a>
        <p class="text-secondary small mb-0">
          &copy; 2026 Swappr Skill Exchange Platform. All rights reserved.
        </p>
      </div>

      <!-- Quick Navigation & Links -->
      <div class="col-md-6 text-center text-md-end">
        <ul class="list-inline mb-0 small">
          <li class="list-inline-item me-3">
            <a href="/dashboard.html" class="text-secondary text-decoration-none hover-white">
              <i class="fa-solid fa-gauge me-1"></i> User Dashboard
            </a>
          </li>
          <li class="list-inline-item me-3">
            <a href="/index.html" class="text-secondary text-decoration-none hover-white">
              <i class="fa-solid fa-house me-1"></i> Home
            </a>
          </li>
          <li class="list-inline-item">
            <span class="badge bg-success bg-opacity-25 text-success border border-success border-opacity-25">
              <i class="fa-solid fa-circle me-1" style="font-size: 8px;"></i> System Online
            </span>
          </li>
        </ul>
      </div>

    </div>
  </div>
</footer>
</body>
</html>
