 <!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Skills -Swappr</title>
   <link rel="icon" type="image/png" href="logo.png?v=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Poppins:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark shadow-sm">
    <div class="container">
      <a class="navbar-brand" href="/">
        <i class="fa-solid fa-repeat text-info me-2"></i>Swa<span>ppr</span>
      </a>
      <div class="ms-auto d-flex gap-2">
        <a href="/dashboard.html" class="btn btn-outline-light btn-sm"><i class="fa-solid fa-gauge me-1"></i> Dashboard</a>
      </div>
    </div>
  </nav>

  <div class="container my-5">
    <!-- Search & Filter Section -->
    <div class="row mb-4">
      <div class="col-md-8 mb-2">
        <div class="input-group">
          <span class="input-group-text bg-white"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
          <input type="text" id="searchInput" class="form-control" placeholder="Search skills by title or description..." onkeyup="filterSkills()">
        </div>
      </div>
      <div class="col-md-4">
        <select id="categoryFilter" class="form-select" onchange="filterSkills()">
          <option value="">All Categories</option>
          <option value="Programming">Programming</option>
          <option value="Music">Music</option>
          <option value="Language">Language</option>
          <option value="Design">Design</option>
        </select>
      </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2><i class="fa-solid fa-lightbulb text-warning me-2"></i> Available Skills</h2>
      <a href="/dashboard.html" class="btn btn-primary"><i class="fa-solid fa-plus me-1"></i> Offer a Skill</a>
    </div>

    <!-- Skills Grid -->
    <div class="row g-4" id="skillsGrid">
      <!-- Dynamic Skill Cards load here -->
    </div>
  </div>

  <script>
    let allSkills = []; // সব স্কিল স্টোর থাকবে

    // ১. API থেকে স্কিল লোড করার ফাংশন
    async function fetchSkills() {
      const container = document.getElementById('skillsGrid');
      try {
        const res = await fetch('/api/skills');
        const data = await res.json();

        if (res.ok) {
          allSkills = data;
          renderSkills(allSkills);
        } else {
          container.innerHTML = `<div class="col-12 text-center py-5"><p class="text-danger">Failed to load skills.</p></div>`;
        }
      } catch (err) {
        container.innerHTML = `<div class="col-12 text-center py-5"><p class="text-danger">Error connecting to server.</p></div>`;
      }
    }

    // ২. ফিল্টারিং লজিক (Search + Category Filter)
    function filterSkills() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const selectedCategory = document.getElementById('categoryFilter').value;

      const filtered = allSkills.filter(skill => {
        const matchesSearch = (skill.title || '').toLowerCase().includes(query) || 
                              (skill.description || '').toLowerCase().includes(query);
        
        const matchesCategory = selectedCategory === '' || skill.category === selectedCategory;

        return matchesSearch && matchesCategory;
      });

      renderSkills(filtered);
    }

    // ৩. UI তে স্কিল রেন্ডার করার ফাংশন
    function renderSkills(skills) {
      const container = document.getElementById('skillsGrid');

      if (!skills || skills.length === 0) {
        container.innerHTML = `<div class="col-12 text-center py-5"><p class="text-muted">No skills found matching your search.</p></div>`;
        return;
      }

      container.innerHTML = skills.map(s => `
        <div class="col-md-4">
          <div class="card h-100 p-3 shadow-sm border-0">
            <div class="card-body d-flex flex-column">
              <div class="d-flex justify-content-between align-items-center mb-2">
                <span class="badge bg-primary-subtle text-primary fw-bold px-3 py-2 rounded-pill">${s.category || 'General'}</span>
                <span class="text-warning fw-bold"><i class="fa-solid fa-clock me-1"></i>${s.duration || 1} Hr</span>
              </div>
              <h5 class="card-title text-dark mt-2 fw-bold">${s.title || 'Untitled Skill'}</h5>
              <p class="card-text text-muted flex-grow-1">${s.description || 'No description provided.'}</p>
              <div class="pt-3 border-top d-flex justify-content-between align-items-center mt-3">
                <small class="text-secondary"><i class="fa-solid fa-user me-1"></i> ${s.user?.name || 'Peer'}</small>
                <button onclick="bookSkill('${s._id}')" class="btn btn-sm btn-primary ms-auto"><i class="fa-solid fa-calendar-check me-1"></i> Book</button>
              </div>
            </div>
          </div>
        </div>
      `).join('');
    }

    // ৪. বুকিং করার ফাংশন
    async function bookSkill(skillId) {
      const token = localStorage.getItem('token');
      if (!token) {
        alert('Please login to book a session!');
        window.location.href = '/login.html';
        return;
      }

      try {
        const res = await fetch('/api/bookings', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ skillId })
        });
        const data = await res.json();
        if(res.ok) {
          alert('Booking created successfully!');
        } else {
          alert(data.message || 'Booking failed');
        }
      } catch (err) {
        alert('Server error during booking.');
      }
    }

    // পেজ লোড হলে স্কিলস আনবে
    fetchSkills();
  </script>
  <!-- Footer Section -->
<footer class="bg-dark text-light py-4 mt-5 border-top border-secondary border-opacity-25">
  <div class="container">
    <div class="row align-items-center g-3">
      
      <!-- Brand & Copyright -->
      <div class="col-md-6 text-center text-md-start">
        <a class="navbar-brand text-warning fw-bold fs-5 d-inline-block mb-1" href="#">
          <i class=""></i>Swa<span class="text-white">ppr</span>
        </a>
        <p class="text-secondary small mb-0">
          &copy; 2026 Swappr Skill Exchange Platform. All rights reserved.
        </p>
      </div>

      <!-- Quick Navigation & Links -->
      <div class="col-md-6 text-center text-md-end">
        <ul class="list-inline mb-0 small">
          <li class="list-inline-item me-3">
            <a href="/dashboard.html" class="text-secondary text-decoration-none hover-white">
              <i class="fa-solid fa-gauge me-1"></i> User Dashboard
            </a>
          </li>
          <li class="list-inline-item me-3">
            <a href="/index.html" class="text-secondary text-decoration-none hover-white">
              <i class="fa-solid fa-house me-1"></i> Home
            </a>
          </li>
          <li class="list-inline-item">
            <span class="badge bg-success bg-opacity-25 text-success border border-success border-opacity-25">
              <i class="fa-solid fa-circle me-1" style="font-size: 8px;"></i> System Online
            </span>
          </li>
        </ul>
      </div>

    </div>
  </div>
</footer>
</body>
</html>
