<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Swappr</title>
  <link rel="icon" type="image/png" href="logo.png?v=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <main class="flex-grow-1 d-flex align-items-center justify-content-center py-5">
    <div class="container" style="max-width: 420px;">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <a href="/" class="text-decoration-none text-muted small">
          <i class="fa-solid fa-arrow-left me-1"></i> Back to Home
        </a>
        <a href="/register.html" class="text-decoration-none text-primary small fw-semibold">
          Create Account
        </a>
      </div>

      <div class="text-center mb-4">
        <a href="/" class="navbar-brand fs-3 text-dark d-inline-flex align-items-center gap-2">
          <i class="fa-solid fa-repeat text-info fs-3"></i>
          <span class="fw-bold">Swa<span class="text-info">ppr</span></span>
        </a>
        <p class="text-muted small mt-1">Sign in to exchange skills with your peers</p>
      </div>

      <div class="card p-4 shadow-sm border-0">
        <div id="alertBox"></div>
        <form id="loginForm">
          <div class="mb-3">
            <label class="form-label fw-semibold small"><i class="fa-regular fa-envelope me-1"></i> Email Address</label>
            <input type="email" id="email" class="form-control" placeholder="name@example.com" required autocomplete="email">
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold small"><i class="fa-solid fa-lock me-1"></i> Password</label>
            <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
          </div>
          <button type="submit" id="btnLogin" class="btn btn-primary w-100 mt-2 py-2 fw-bold shadow-sm">
            <i class="fa-solid fa-right-to-bracket me-1"></i> Log In
          </button>
        </form>

        <div class="text-center mt-3 pt-3 border-top">
          <small class="text-muted">Don't have an account yet? <a href="/register.html" class="text-primary text-decoration-none fw-bold">Sign up free</a></small>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer Section -->
  <footer class="w-100 bg-dark text-light py-4 border-top border-secondary border-opacity-25">
    <div class="container">
      <div class="row align-items-center g-3">
        <div class="col-md-6 text-center text-md-start">
          <a class="navbar-brand text-warning fw-bold fs-5 d-inline-block mb-1" href="/">
            <i class="fa-solid fa-repeat text-info me-2"></i>Swa<span class="text-white">ppr</span>
          </a>
          <p class="text-secondary small mb-0">
            &copy; 2026 Swappr Skill Exchange Platform. All rights reserved.
          </p>
        </div>
        <div class="col-md-6 text-center text-md-end">
          <ul class="list-inline mb-0 small">
            <li class="list-inline-item me-3">
              <a href="/index.html" class="text-secondary text-decoration-none hover-white">
                <i class="fa-solid fa-house me-1"></i> Home
              </a>
            </li>
            <li class="list-inline-item me-3">
              <a href="/skills.html" class="text-secondary text-decoration-none hover-white">
                <i class="fa-solid fa-compass me-1"></i> Browse Skills
              </a>
            </li>
            <li class="list-inline-item">
              <span class="badge bg-success bg-opacity-25 text-success border border-success border-opacity-25">
                <i class="fa-solid fa-circle me-1" style="font-size: 8px;"></i> System Online
              </span>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/main.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const alertBox = document.getElementById('alertBox');
      const btn = document.getElementById('btnLogin');
      const originalText = btn.innerHTML;

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Authenticating...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (res.ok) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          window.location.href = '/dashboard.html';
        } else {
          alertBox.innerHTML = `<div class="alert alert-danger py-2 small"><i class="fa-solid fa-circle-exclamation me-1"></i> ${data.message || 'Invalid credentials'}</div>`;
        }
      } catch (err) {
        alertBox.innerHTML = `<div class="alert alert-danger py-2 small"><i class="fa-solid fa-triangle-exclamation me-1"></i> Server connection failed. Please try again.</div>`;
      } finally {
        btn.disabled = false;
        btn.innerHTML = originalText;
      }
    });
  </script>
</body>
</html>
